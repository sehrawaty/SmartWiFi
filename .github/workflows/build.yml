name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/SmartWiFi.Core.Tests -c Release

      - name: Publish SmartWiFi.exe
        run: dotnet publish src/SmartWiFi -c Release -o publish

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/SmartWiFi.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SmartWiFi.exe" | Out-File -Encoding ascii publish/SmartWiFi.exe.sha256
          Get-Content publish/SmartWiFi.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SmartWiFi
          path: |
            publish/SmartWiFi.exe
            publish/SmartWiFi.exe.sha256

      # A release is published whenever <Version> in SmartWiFi.csproj has no release yet,
      # so bumping the version on main is all it takes to ship. Pushing a v* tag works too.
      - name: Release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$proj = Get-Content src/SmartWiFi/SmartWiFi.csproj
          $version = "v" + ($proj.Project.PropertyGroup | Where-Object { $_.Version } | Select-Object -First 1).Version
          if ($env:GITHUB_REF -like "refs/tags/v*") { $version = $env:GITHUB_REF_NAME }
          gh release view $version *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "$version is already released"; exit 0 }
          gh release create $version publish/SmartWiFi.exe publish/SmartWiFi.exe.sha256 scripts/install.ps1 `
            --target $env:GITHUB_SHA --title "SmartWiFi $version" --generate-notes
