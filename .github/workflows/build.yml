name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test tests/SmartWiFi.Core.Tests -c Release

      - name: Publish SmartWiFi.exe
        run: dotnet publish src/SmartWiFi -c Release -o publish

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash publish/SmartWiFi.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  SmartWiFi.exe" | Out-File -Encoding ascii publish/SmartWiFi.exe.sha256
          Get-Content publish/SmartWiFi.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SmartWiFi
          path: |
            publish/SmartWiFi.exe
            publish/SmartWiFi.exe.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" publish/SmartWiFi.exe publish/SmartWiFi.exe.sha256 scripts/install.ps1 `
            --title "SmartWiFi ${{ github.ref_name }}" --generate-notes
